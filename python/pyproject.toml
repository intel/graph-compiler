[project]
name = "graph_compiler"
version = "1.0.0"

[build-system]
requires = ["setuptools", "wheel", "nanobind"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest", "torch>=2.0.0", "torch-mlir"]

[tool.uv.sources]
torch = { index = "pytorch", extra = "xpu" }
torch-mlir = { index = "torch_mlir" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "torch_mlir"
url = "https://github.com/llvm/torch-mlir-release/releases/expanded_assets/dev-wheels"
explicit = true
