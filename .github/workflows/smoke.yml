name: Build and smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-26.04
    env:
      GC_BUILD_TYPE: Release
      LLVM_BUILD_TYPE: Release
      LLVM_BUILD_TARGET: install
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime
      CCACHE_COMPILERCHECK: content

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Install formatting tools and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libze-dev ccache
          echo "CCACHE_ROOT=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          pip install cmake==4.4.4 nanobind==2.9 lit==23.1.3 \
            clang-format==23.1.3 cmake-format==0.6.13 ruff==0.17.1

      - name: List changed files
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          if git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            git diff --name-only --diff-filter=d -z "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
          else
            git ls-files -z > "$RUNNER_TEMP/changed-files"
          fi

      - name: clang-format
        run: |
          sed -z -nE '/\.(h|cpp)$/p' "$RUNNER_TEMP/changed-files" \
            | xargs -0 -r -P "$(nproc)" clang-format --dry-run --Werror

      - name: cmake-format
        run: |
          sed -z -nE '/(^|\/)(CMakeLists\.txt|[^/]+\.cmake)$/p' "$RUNNER_TEMP/changed-files" \
            | xargs -0 -r -P "$(nproc)" cmake-format --check

      - name: ruff-format
        run: |
          sed -z -nE '/\.py$/p' "$RUNNER_TEMP/changed-files" \
            | xargs -0 -r -P "$(nproc)" ruff format --check

      # Caches are saved right after each build, so later failures do not discard them.
      # Eviction runs only after a successful build: entries unused by a complete build are stale.
      # A failed build still saves its ccache, unevicted, to keep the work done so far.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llvm
        with:
          path: externals/llvm/${{ env.LLVM_BUILD_TYPE }}
          key: llvm-${{ env.LLVM_BUILD_TYPE }}-${{ hashFiles('cmake/llvm-version.txt', 'patches/*.patch', 'scripts/build.sh') }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.llvm.outputs.cache-hit != 'true'
        id: llvm-ccache
        with:
          path: ${{ env.CCACHE_ROOT }}/llvm
          key: ccache-llvm-${{ env.LLVM_BUILD_TYPE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-llvm-${{ env.LLVM_BUILD_TYPE }}-

      # Build steps output cache_miss; a ccache without misses is not saved again.
      - name: Build LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        id: llvm-build
        env:
          CCACHE_DIR: ${{ env.CCACHE_ROOT }}/llvm
          GC_BUILD_SKIP: 1
        run: &build |
          ccache -z
          start=$EPOCHSECONDS
          ./scripts/build.sh
          ccache --evict-older-than "$((EPOCHSECONDS - start + 1))s"
          ccache -s
          ccache --print-stats | awk -F'\t' '$1 == "cache_miss" { print $1 "=" $2 }' >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.llvm.outputs.cache-hit != 'true'
        with:
          path: externals/llvm/${{ env.LLVM_BUILD_TYPE }}
          key: ${{ steps.llvm.outputs.cache-primary-key }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && (steps.llvm-build.outputs.cache_miss > 0 || steps.llvm-build.outcome == 'failure') }}
        with:
          path: ${{ env.CCACHE_ROOT }}/llvm
          key: ${{ steps.llvm-ccache.outputs.cache-primary-key }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gc-ccache
        with:
          path: ${{ env.CCACHE_ROOT }}/gc
          key: ccache-gc-${{ env.GC_BUILD_TYPE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-gc-${{ env.GC_BUILD_TYPE }}-

      - name: Build and install GC
        id: gc-build
        env:
          CCACHE_DIR: ${{ env.CCACHE_ROOT }}/gc
          LLVM_BUILD_SKIP: 1
        run: *build

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && (steps.gc-build.outputs.cache_miss > 0 || steps.gc-build.outcome == 'failure') }}
        with:
          path: ${{ env.CCACHE_ROOT }}/gc
          key: ${{ steps.gc-ccache.outputs.cache-primary-key }}

      - name: Run lit tests
        timeout-minutes: 30
        run: cmake --build "build/$GC_BUILD_TYPE" --target gc-check
