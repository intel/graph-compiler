name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      GC_BUILD_TYPE: Release
      LLVM_BUILD_TYPE: Release
      LLVM_BUILD_TARGET: install
      CC: cl
      CXX: cl
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime
      CCACHE_COMPILERCHECK: content

    steps:
      # The LLVM sources and the patches must keep LF, LLVM paths exceed MAX_PATH.
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # Level Zero SDK: headers and ze_loader.lib to build the GC runtime and Python bindings.
      - name: Install build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          ZE_VERSION: v1.35.0
        run: |
          choco install -y --no-progress ccache
          ze="$RUNNER_TEMP/level-zero"
          gh release download "$ZE_VERSION" -R oneapi-src/level-zero -p "level-zero-win-sdk-${ZE_VERSION#v}.zip" -D "$ze"
          7z x -bd -o"$ze" "$ze"/*.zip > /dev/null
          echo "CMAKE_PREFIX_PATH=$(cygpath -m "$ze")" >> "$GITHUB_ENV"
          echo "CCACHE_ROOT=$(cygpath -m "$RUNNER_TEMP/ccache")" >> "$GITHUB_ENV"
          PROJECT_DIR=$PWD . scripts/create-venv.sh
          "$PYTHON" -m pip install cmake==4.4.4 ninja==1.13.2 lit==23.1.3 "$NANOBIND"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llvm
        with:
          path: externals/llvm/${{ env.LLVM_BUILD_TYPE }}
          key: win-llvm-${{ env.LLVM_BUILD_TYPE }}-${{ hashFiles('cmake/llvm-*', 'patches/*.patch', 'scripts/build.sh') }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.llvm.outputs.cache-hit != 'true'
        id: llvm-ccache
        with:
          path: ${{ env.CCACHE_ROOT }}/llvm
          key: win-ccache-llvm-${{ env.LLVM_BUILD_TYPE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: win-ccache-llvm-${{ env.LLVM_BUILD_TYPE }}-

      # A cold LLVM build may exceed the job limit. The step timeout fails the step
      # instead of cancelling the job, so the ccache is saved and the next run resumes.
      - name: Build LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        id: llvm-build
        timeout-minutes: 300
        env:
          CCACHE_DIR: ${{ env.CCACHE_ROOT }}/llvm
          GC_BUILD_SKIP: 1
        run: &build |
          ccache -z
          start=$EPOCHSECONDS
          ./scripts/build.sh
          ccache --evict-older-than "$((EPOCHSECONDS - start + 1))s"
          ccache -s
          ccache --print-stats | awk -F'\t' '$1 == "cache_miss" { print $1 "=" $2 }' >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.llvm.outputs.cache-hit != 'true'
        with:
          path: externals/llvm/${{ env.LLVM_BUILD_TYPE }}
          key: ${{ steps.llvm.outputs.cache-primary-key }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && (steps.llvm-build.outputs.cache_miss > 0 || steps.llvm-build.outcome == 'failure') }}
        with:
          path: ${{ env.CCACHE_ROOT }}/llvm
          key: ${{ steps.llvm-ccache.outputs.cache-primary-key }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gc-ccache
        with:
          path: ${{ env.CCACHE_ROOT }}/gc
          key: win-ccache-gc-${{ env.GC_BUILD_TYPE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: win-ccache-gc-${{ env.GC_BUILD_TYPE }}-

      - name: Build and install GC
        id: gc-build
        env:
          CCACHE_DIR: ${{ env.CCACHE_ROOT }}/gc
          LLVM_BUILD_SKIP: 1
        run: *build

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && (steps.gc-build.outputs.cache_miss > 0 || steps.gc-build.outcome == 'failure') }}
        with:
          path: ${{ env.CCACHE_ROOT }}/gc
          key: ${{ steps.gc-ccache.outputs.cache-primary-key }}
